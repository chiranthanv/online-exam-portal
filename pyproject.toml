[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["backend/portal/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["backend/portal"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "*/management/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.coverage.xml]
output = "coverage.xml"
