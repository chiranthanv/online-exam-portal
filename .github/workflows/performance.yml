name: Disposable 200-student performance
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/performance/**'
      - 'backend/**'
      - '.github/workflows/performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: oep_perf_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U portal -d oep_perf_ci'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://portal:disposable-ci-only@localhost:5432/oep_perf_ci
      PERF_OUTPUT: /tmp/oep-performance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real PostgreSQL lock regressions
        run: python backend/manage.py test portal.tests.test_postgres --verbosity 2
      - name: 200 students, browser timing, two application instances and EXPLAIN
        run: bash scripts/performance/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-evidence
          path: |
            /tmp/oep-performance/*.json
            /tmp/oep-performance/*.log
            /tmp/oep-performance/hardware.txt
            !/tmp/oep-performance/credentials.json
          retention-days: 30
