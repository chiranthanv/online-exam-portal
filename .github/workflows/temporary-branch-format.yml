name: Temporary branch formatting pass
on:
  push:
    branches: [fix/dwijesh-open-issues]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Format changed frontend files
        run: npx prettier --write src/api.js src/api.test.js src/exams.jsx src/style.css tests/sprint1.spec.js
        working-directory: frontend
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/api.js frontend/src/api.test.js frontend/src/exams.jsx frontend/src/style.css frontend/tests/sprint1.spec.js
          if git diff --cached --quiet; then
            echo "Files are already formatted."
          else
            git commit -m "style: format exam attempt changes"
            git push origin HEAD:${{ github.ref_name }}
          fi
