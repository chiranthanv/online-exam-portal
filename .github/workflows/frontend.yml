name: Sprint 1 integrated frontend
on:
  push:
    branches: [main, 'sprint1/**']
  pull_request:
    branches: [main, 'planning/**']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: portal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portal -d portal"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://portal:ci-only-password@localhost:5432/portal
      DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python backend/manage.py migrate --noinput
          .venv/bin/python backend/manage.py seed_demo
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint1-browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
