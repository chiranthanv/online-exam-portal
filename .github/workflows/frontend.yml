name: Sprint 1 integrated frontend
on:
  push:
    branches: [main, 'sprint1/**', 'sprint2/**']
  pull_request:
    branches: [main, 'planning/**', 'sprint2/**']
  workflow_dispatch:
    inputs:
      record_demo:
        description: 'Record the historical one-minute walkthrough (only after operator approval)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  temporary-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit frontend lockfile
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm audit --json > "$RUNNER_TEMP/frontend-audit.json" || true
          node -e '
            const a = require(process.argv[1]);
            console.log("FRONTEND_AUDIT_SUMMARY", JSON.stringify(a.metadata?.vulnerabilities ?? a.error ?? {}));
            for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) {
              console.log("FRONTEND_ADVISORY", JSON.stringify({
                name, severity: v.severity, isDirect: v.isDirect, range: v.range,
                nodes: v.nodes, effects: v.effects, fixAvailable: v.fixAvailable,
                via: (v.via ?? []).map(x => typeof x === "string" ? x : {
                  name: x.name, title: x.title, url: x.url, range: x.range,
                  severity: x.severity, cwe: x.cwe, cvss: x.cvss
                })
              }));
            }
          ' "$RUNNER_TEMP/frontend-audit.json"
      - name: Audit accessibility lockfile
        working-directory: tools/accessibility
        shell: bash
        run: |
          npm ci
          npm audit --json > "$RUNNER_TEMP/accessibility-audit.json" || true
          node -e '
            const a = require(process.argv[1]);
            console.log("ACCESSIBILITY_AUDIT_SUMMARY", JSON.stringify(a.metadata?.vulnerabilities ?? a.error ?? {}));
            for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) {
              console.log("ACCESSIBILITY_ADVISORY", JSON.stringify({
                name, severity: v.severity, isDirect: v.isDirect, range: v.range,
                nodes: v.nodes, effects: v.effects, fixAvailable: v.fixAvailable,
                via: (v.via ?? []).map(x => typeof x === "string" ? x : {
                  name: x.name, title: x.title, url: x.url, range: x.range,
                  severity: x.severity, cwe: x.cwe, cvss: x.cvss
                })
              }));
            }
          ' "$RUNNER_TEMP/accessibility-audit.json"
      - name: Upgrade Vitest to the patched major and run frontend checks
        working-directory: frontend
        shell: bash
        run: |
          npm install --save-dev vitest@^5.1.0
          npm audit --json > "$RUNNER_TEMP/frontend-audit-after.json" || true
          node -e 'const a=require(process.argv[1]); console.log("FRONTEND_AFTER_SUMMARY",JSON.stringify(a.metadata?.vulnerabilities ?? a.error ?? {})); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log("FRONTEND_AFTER_ADVISORY",JSON.stringify({name,severity:v.severity,range:v.range,nodes:v.nodes,fixAvailable:v.fixAvailable,via:(v.via??[]).map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range,severity:x.severity})}));' "$RUNNER_TEMP/frontend-audit-after.json"
          npm run lint
          npm test -- --reporter=default
          npm run build
      - name: Apply non-breaking npm audit fixes to accessibility tools
        working-directory: tools/accessibility
        shell: bash
        run: |
          npm audit fix
          npm audit --json > "$RUNNER_TEMP/accessibility-audit-after.json" || true
          node -e 'const a=require(process.argv[1]); console.log("ACCESSIBILITY_AFTER_SUMMARY",JSON.stringify(a.metadata?.vulnerabilities ?? a.error ?? {})); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log("ACCESSIBILITY_AFTER_ADVISORY",JSON.stringify({name,severity:v.severity,range:v.range,nodes:v.nodes,fixAvailable:v.fixAvailable,via:(v.via??[]).map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range,severity:x.severity})}));' "$RUNNER_TEMP/accessibility-audit-after.json"
          npm ci
          npm audit --audit-level=moderate
      - name: Upload updated dependency files and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-fix-candidate
          path: |
            ${{ github.workspace }}/frontend/package.json
            ${{ github.workspace }}/frontend/package-lock.json
            ${{ github.workspace }}/tools/accessibility/package-lock.json
            ${{ runner.temp }}/frontend-audit-after.json
            ${{ runner.temp }}/accessibility-audit-after.json
      - name: Upload audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: |
            ${{ runner.temp }}/frontend-audit.json
            ${{ runner.temp }}/accessibility-audit.json
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: portal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portal -d portal"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://portal:ci-only-password@localhost:5432/portal
      DEBUG: '1'
      PLAYWRIGHT_VIDEO: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python backend/manage.py migrate --noinput
          .venv/bin/python backend/manage.py seed_demo
      - run: npm ci
        working-directory: frontend
      - name: Temporary frontend npm audit details
        working-directory: frontend
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/frontend-audit.json" || true
          node -e '
            const a = require(process.argv[1]);
            console.log("FRONTEND_AUDIT_SUMMARY", JSON.stringify(a.metadata?.vulnerabilities ?? a.error ?? {}));
            for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) {
              console.log("FRONTEND_ADVISORY", JSON.stringify({
                name, severity: v.severity, isDirect: v.isDirect, range: v.range,
                nodes: v.nodes, effects: v.effects, fixAvailable: v.fixAvailable,
                via: (v.via ?? []).map(x => typeof x === "string" ? x : {
                  name: x.name, title: x.title, url: x.url, range: x.range,
                  severity: x.severity, cwe: x.cwe, cvss: x.cvss
                })
              }));
            }
          ' "$RUNNER_TEMP/frontend-audit.json"
      - run: npm run lint && npm test -- --reporter=default --reporter=json --outputFile=unit-results.json && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e -- --reporter=list,html,json
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-results.json
      - name: Run authenticated exam Lighthouse audit on disposable SQLite data
        run: bash tools/accessibility/run-ci.sh
        env:
          AUDIT_OUTPUT: ${{ runner.temp }}/oep-authenticated-exam-accessibility
      - name: Temporary accessibility npm audit details
        shell: bash
        run: |
          npm ci --prefix tools/accessibility
          npm audit --json --prefix tools/accessibility > "$RUNNER_TEMP/accessibility-audit.json" || true
          node -e '
            const a = require(process.argv[1]);
            console.log("ACCESSIBILITY_AUDIT_SUMMARY", JSON.stringify(a.metadata?.vulnerabilities ?? a.error ?? {}));
            for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) {
              console.log("ACCESSIBILITY_ADVISORY", JSON.stringify({
                name, severity: v.severity, isDirect: v.isDirect, range: v.range,
                nodes: v.nodes, effects: v.effects, fixAvailable: v.fixAvailable,
                via: (v.via ?? []).map(x => typeof x === "string" ? x : {
                  name: x.name, title: x.title, url: x.url, range: x.range,
                  severity: x.severity, cwe: x.cwe, cvss: x.cvss
                })
              }));
            }
          ' "$RUNNER_TEMP/accessibility-audit.json"
      - name: Upload npm audit JSON details (temporary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-json
          path: |
            ${{ runner.temp }}/frontend-audit.json
            ${{ runner.temp }}/accessibility-audit.json
          if-no-files-found: warn
      - name: Upload authenticated exam accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-exam-accessibility
          path: ${{ runner.temp }}/oep-authenticated-exam-accessibility/
          if-no-files-found: warn
      - name: Record actual one-minute product walkthrough
        if: github.event_name == 'workflow_dispatch' && inputs.record_demo
        run: npm run record:demo
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint1-browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/demo-results/
            frontend/unit-results.json
            frontend/e2e-results.json
